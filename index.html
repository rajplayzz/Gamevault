<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>GameVault — Pre-owned PS5 & PS4 Discs</title>
<style>
:root{--bg:#080b12;--p:#101622;--line:#263246;--text:#f4f7fb;--muted:#9aa8bc;--blue:#2684ff;--cyan:#49c7ff;--green:#54d69a}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#14243d,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{width:min(1160px,calc(100% - 32px));margin:auto}.muted{color:var(--muted);font-size:13px}
header{position:sticky;top:0;z-index:20;background:#080b12ee;backdrop-filter:blur(16px);border-bottom:1px solid #1b2636}
.nav{min-height:70px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;letter-spacing:.07em;font-size:19px}
.mark{width:32px;height:32px;border:1px solid #438dff;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#1b4e9b,#0b1425)}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;background:#111a28;border:1px solid #29374d;border-radius:12px;padding:12px 40px 12px 40px;outline:none;transition:.2s}
.search input:focus{border-color:#398cff;box-shadow:0 0 0 3px #2684ff22}.search i{position:absolute;left:14px;top:11px;font-style:normal;color:#91a3bd}
.search kbd{position:absolute;right:12px;top:11px;font-size:11px;border:1px solid #33445d;border-radius:5px;padding:0 6px;color:#7f92ad}
#sug{position:absolute;top:50px;left:0;right:0;background:#101927;border:1px solid #30415a;border-radius:12px;overflow:hidden;display:none;box-shadow:0 20px 60px #000a}
#sug.show{display:block}#sug button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid #1b2636;padding:10px 14px;text-align:left}#sug button:hover,#sug button.on{background:#16243a}
.acts{display:flex;gap:8px}.ib{border:1px solid #29374d;background:#111a28;border-radius:12px;padding:10px 13px;transition:.2s}.ib:hover{border-color:#3a78bb}.ib b{background:var(--blue);border-radius:20px;padding:1px 7px;font-size:11px;margin-left:4px}
.hero{padding:34px 0 20px}.hb{position:relative;overflow:hidden;border:1px solid #253957;border-radius:26px;padding:clamp(24px,5vw,56px);background:linear-gradient(112deg,#101c30,#0d1422 52%,#102b50)}
.hb:after{content:"";position:absolute;width:340px;height:340px;border:1px solid #318cff55;border-radius:50%;right:5%;top:-70px;box-shadow:0 0 0 28px #2684ff0b,0 0 0 58px #2684ff08,0 0 80px #1674ff22}
.hb h1{font-size:clamp(32px,6vw,60px);line-height:1.03;max-width:640px;margin:0 0 14px}.hb p{color:#b2c0d3;max-width:480px;margin:0 0 22px}
.stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}.stats b{display:block;font-size:22px}.hb>*{position:relative;z-index:1}
.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;background:linear-gradient(110deg,#1674f5,#39b8ff);color:#fff;transition:.2s}.btn:hover{filter:brightness(1.1)}.btn.s{background:#172438;border:1px solid #344963}.btn:disabled{opacity:.4;cursor:not-allowed}
.sec{padding:22px 0 10px}.head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}.sec h2{font-size:22px;margin:0;letter-spacing:-.03em}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{border:1px solid #2a3a51;background:#111a28;border-radius:999px;padding:8px 14px;font-size:13px;color:#c7d3e3;transition:.2s}.chip.on{background:#123a70;border-color:#368eff;color:#fff}
select.chip{padding-right:8px}.price-f{display:flex;align-items:center;gap:8px;font-size:13px;color:#c7d3e3}input[type=range]{accent-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:linear-gradient(180deg,#111a28,#0e1520);border:1px solid #243247;border-radius:16px;overflow:hidden;transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-4px);border-color:#3a78bb}
.cover{position:relative;aspect-ratio:4/5;display:flex;align-items:end;padding:14px;overflow:hidden;background:var(--t);cursor:pointer}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .5s}.cover img.ok{opacity:1}.card:hover .cover img{transform:scale(1.04)}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#050911cc,transparent 55%);pointer-events:none}
.cover.sk:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff12 50%,transparent 70%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
